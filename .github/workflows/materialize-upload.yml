name: Materialize upload
on:
  push:
    branches: [cursor/poc-inventario-774c]
    paths: ['.upload/**', 'scripts/materialize-upload.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/materialize-upload.mjs
      - name: Commit materialized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(app)/compras/tablero-compras.tsx" data/seed.json supabase/seed.sql package-lock.json || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "POC Inventario SAEB: materializar seed, tablero y package-lock"
          git push
