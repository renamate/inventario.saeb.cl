name: Materialize upload
on:
  push:
    branches: [cursor/poc-inventario-774c]
    paths: ['.upload/**', 'scripts/materialize-upload.cjs', '.github/workflows/materialize-upload.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and upload via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/materialize-upload.cjs
          BRANCH=cursor/poc-inventario-774c
          upload() {
            local fpath="$1"
            local msg="$2"
            python3 - "$fpath" "$msg" "$BRANCH" <<'PY'
          import json, os, sys, base64, urllib.request
          path, msg, branch = sys.argv[1:4]
          with open(path, 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          # path may contain slashes; quote for URL
          from urllib.parse import quote
          api = f"https://api.github.com/repos/{repo}/contents/{quote(path)}"
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'materialize-upload',
          }
          sha = None
          try:
              req = urllib.request.Request(api + f'?ref={branch}', headers=headers)
              with urllib.request.urlopen(req) as resp:
                  sha = json.load(resp).get('sha')
          except Exception:
              pass
          body = {'message': msg, 'content': content_b64, 'branch': branch}
          if sha:
              body['sha'] = sha
          data = json.dumps(body).encode()
          req = urllib.request.Request(api, data=data, headers=headers, method='PUT')
          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)
          print('uploaded', path, result.get('content', {}).get('size'), result.get('commit', {}).get('sha', '')[:10])
          PY
          }
          upload "src/app/(app)/compras/tablero-compras.tsx" "POC: tablero-compras completo"
          upload "data/seed.json" "POC: data/seed.json"
          upload "supabase/seed.sql" "POC: supabase/seed.sql"
          if [ -f package-lock.json ]; then
            upload "package-lock.json" "POC: package-lock.json"
          fi
