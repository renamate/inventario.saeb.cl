name: Materialize upload
on:
  push:
    branches: [cursor/poc-inventario-774c]
    paths: ['.upload/**', 'scripts/materialize-upload.cjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and upload via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          node scripts/materialize-upload.cjs
          BRANCH=cursor/poc-inventario-774c
          upload() {
            local path="$1"
            local msg="$2"
            local b64
            b64=$(base64 -w0 "$path")
            local sha
            sha=$(gh api "repos/${{ github.repository }}/contents/${path}?ref=${BRANCH}" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/${{ github.repository }}/contents/${path}" \
                -f message="$msg" -f content="$b64" -f branch="$BRANCH" -f sha="$sha"
            else
              gh api --method PUT "repos/${{ github.repository }}/contents/${path}" \
                -f message="$msg" -f content="$b64" -f branch="$BRANCH"
            fi
          }
          upload "src/app/(app)/compras/tablero-compras.tsx" "POC: tablero-compras completo"
          upload "data/seed.json" "POC: data/seed.json"
          upload "supabase/seed.sql" "POC: supabase/seed.sql"
          if [ -f package-lock.json ]; then
            upload "package-lock.json" "POC: package-lock.json"
          fi
