name: Materialize upload
on:
  push:
    branches: [cursor/poc-inventario-774c]
    paths: ['.upload/**', 'scripts/materialize-upload.cjs', 'scripts/upload-contents.py', '.github/workflows/materialize-upload.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and upload via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          node scripts/materialize-upload.cjs
          BRANCH=cursor/poc-inventario-774c
          python3 scripts/upload-contents.py "src/app/(app)/compras/tablero-compras.tsx" "POC: tablero-compras completo" "$BRANCH"
          python3 scripts/upload-contents.py "data/seed.json" "POC: data/seed.json" "$BRANCH"
          python3 scripts/upload-contents.py "supabase/seed.sql" "POC: supabase/seed.sql" "$BRANCH"
          if [ -f package-lock.json ]; then
            python3 scripts/upload-contents.py "package-lock.json" "POC: package-lock.json" "$BRANCH"
          fi
