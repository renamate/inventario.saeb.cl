name: Expand package-lock
on:
  push:
    branches: [cursor/neon-migration-101f]
    paths: ['db/.package-lock.part0.zlib.b64', 'db/.package-lock.part1.zlib.b64', 'db/.package-lock.part2.zlib.b64', 'db/.package-lock.part3.zlib.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode package-lock.json
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          parts = [pathlib.Path(f'db/.package-lock.part{i}.zlib.b64').read_text().strip() for i in range(4)]
          data = zlib.decompress(base64.b64decode(''.join(parts)))
          pathlib.Path('package-lock.json').write_bytes(data)
          print(f'wrote package-lock.json ({len(data)} bytes)')
          PY
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore(neon): expand package-lock.json from zlib parts"
          git push
