name: Expand package-lock
on:
  push:
    branches: [cursor/neon-migration-101f]
    paths: ['db/.package-lock.part15.zlib.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode package-lock.json
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib, re, sys
          parts = []
          for i in range(16):
              p = pathlib.Path(f'db/.package-lock.part{i}.zlib.b64')
              if not p.exists():
                  print(f'missing {p}', file=sys.stderr)
                  sys.exit(1)
              parts.append(re.sub(r'\s+', '', p.read_text()))
          data = zlib.decompress(base64.b64decode(''.join(parts)))
          pathlib.Path('package-lock.json').write_bytes(data)
          print(f'wrote package-lock.json ({len(data)} bytes)')
          PY
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore(neon): expand package-lock.json from zlib parts"
          git push
